<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internship Form</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h3 class="mb-4">Internship Application Form</h3>

  <form class="needs-validation" novalidate>

    <!-- ===== 1st Row : First Name, Last Name, Email ===== -->
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" id="first-name-input" required>
        <div class="invalid-feedback">First name is required</div>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" id="last-name-input" required>
        <div class="invalid-feedback">Last name is required</div>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email-input" required>
        <div class="invalid-feedback">Enter a valid email</div>
      </div>
    </div>

    <!-- ===== 2nd Row : College, Graduation Year, Roll No ===== -->
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">College Name</label>
        <input type="text" class="form-control" id="college-input" required>
        <div class="invalid-feedback">College name is required</div>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Graduation Year</label>
        <select class="form-select" required>
          <option value="">Select Year</option>
          <option>2020</option>
          <option>2021</option>
          <option>2022</option>
          <option>2023</option>
        </select>
        <div class="invalid-feedback">Select graduation year</div>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Roll No</label>
        <input type="number" class="form-control" id="roll-no-input" required>
        <div class="invalid-feedback">Roll number is required</div>
      </div>
    </div>

    <!-- ===== 3rd Row : Terms & Conditions ===== -->
    <div class="row">
      <div class="col-md-12 mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="conditions-checkbox" required>
          <label class="form-check-label">
            I agree to the terms and conditions
          </label>
          <div class="invalid-feedback">
            You must agree before submitting
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Submit Button ===== -->
    <button class="btn btn-primary" type="submit">
      Submit Form
    </button>

  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
